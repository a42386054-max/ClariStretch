name: Auto Compile Claristretch to EXE

on:
  push:
    branches:
      - main  # Change to 'master' if your default branch uses that name

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # Installs PyInstaller and all required libraries
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt

    # Compiles code, hides console, bundles assets folder, and attaches icon.ico
    - name: Compile Script to EXE
      run: |
        pyinstaller --onefile --noconsole --add-data "assets;assets" --icon="assets/icon.ico" claristretch.py

    # Uploads the finished 'claristretch.exe' file to your GitHub dashboard
    - name: Upload Compiled EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: claristretch-windows-executable
        path: dist/claristretch.exe
        retention-days: 30
name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    
    # ⬇️ ADD THESE LINES HERE ⬇️
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ... your build steps ...

      - name: Run softprops/action-gh-release
        uses: softprops/action-gh-release@v2
        with:
          files: claristretch-windows-executable.zip
