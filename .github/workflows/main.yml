name: Build and Release Windows Executable on Push

on:
  push:
    branches:
      - main # Triggers automatically every time new code is pushed to main
  workflow_dispatch: # Allows manual trigger if needed

permissions:
  contents: write # Crucial: Allows GitHub Actions to create the release and upload the .exe

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "Nuitka[onefile]"
        if (Test-Path requirements.txt) { pip install -r requirements.txt }

    # --- START OF CACHE STEP ---
    - name: Cache Nuitka Build Dependencies & Ccache
      uses: actions/cache@v4
      with:
        path: ~\AppData\Local\Nuitka\Nuitka
        key: ${{ runner.os }}-nuitka-${{ hashFiles('**/requirements.txt') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-nuitka-${{ hashFiles('**/requirements.txt') }}-
          ${{ runner.os }}-nuitka-
    # --- END OF CACHE STEP ---

    # CORRECTED NUITKA ACTION WITH VALID EXPLICIT INPUTS
    - name: Build EXE with Nuitka
      uses: Nuitka/Nuitka-Action@main
      with:
        nuitka-version: main
        script-name: claristretch.py
        mode: onefile
        assume-yes-for-downloads: true
        enable-plugins: pyqt6
        windows-console-mode: disable
        windows-icon-from-ico: assets/icon.ico
        include-data-dir: assets=assets

    # This step triggers on every push, creating a unique release version
    - name: Create GitHub Release
      id: create_release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: build-${{ github.run_number }}
        name: Build Version ${{ github.run_number }}
        body: |
          Automated compilation from latest push.
          Commit: ${{ github.sha }}
        draft: false
        prerelease: false
        files: build/*.exe
