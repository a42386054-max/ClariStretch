name: Build Windows Executable

on:
  push:
    branches:
      - main # Triggers the build every time you push to the main branch
  workflow_dispatch: # Allows you to manually trigger the build from the Actions tab

jobs:
  build:
    runs-on: windows-latest

    steps:
    # Step 1: Download your repository code onto the runner
    - name: Checkout repository
      uses: actions/checkout@v4

    # Step 2: Set up the Python environment
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-python-version: '3.11' # Change to your preferred Python version
        cache: 'pip' # Automatically caches dependencies for faster subsequent runs

    # Step 3: Install required tools and your project dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if (Test-Path requirements.txt) { pip install -r requirements.txt }

    # Step 4: Compile the script into a single .exe file
    # Replace "main.py" with the entry point file of your script
    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --onefile main.py

    # Step 5: Upload the compiled .exe file so you can download it from GitHub
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-executable
        path: dist/*.exe
