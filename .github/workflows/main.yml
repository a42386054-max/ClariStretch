name: Build and Release Windows Executable on Push

on:
  push:
    branches:
      - main # Triggers automatically every time new code is pushed to main
  workflow_dispatch: # Allows manual trigger if needed

permissions:
  contents: write # Crucial: Allows GitHub Actions to create the release and upload the .exe

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if (Test-Path requirements.txt) { pip install -r requirements.txt }

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --onefile claristretch.py

    # This step triggers on every push, creating a unique release version
    - name: Create GitHub Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: Build Version ${{ github.run_number }}
        body: |
          Automated compilation from latest push.
          Commit: ${{ github.sha }}
        draft: false
        prerelease: false
        files: dist/*.exe
