name: Build and Release Windows Executable on Push

on:
  push:
    branches:
      - main # Triggers automatically every time new code is pushed to main
  workflow_dispatch: # Allows manual trigger if needed

permissions:
  contents: write # Required so the workflow can create the release and upload the .exe

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if (Test-Path requirements.txt) { pip install -r requirements.txt }

    - name: Build EXE with PyInstaller
      # Mirrors the build command documented in README.md, so a GitHub Actions build
      # and a local build never drift apart:
      #   --windowed     no console window behind the GUI
      #   --icon         stamps assets/icon.ico onto the .exe file itself
      #   --add-data     bundles assets/icon.png so the running window has its icon
      #   --exclude-module  drops astropy.samp / pyvo, which ClariStretch never uses
      #   --noupx        never compress the binary with UPX; UPX-packed executables
      #                  are flagged by antivirus engines far more often
      run: |
        pyinstaller --onefile --windowed --noupx --name ClariStretch `
          --icon assets/icon.ico `
          --add-data "assets/icon.png;assets" `
          --exclude-module astropy.samp --exclude-module pyvo `
          claristretch.py

    - name: Name the exe with the GitHub Actions build number
      # github.run_number counts up by one on every workflow run, so each download
      # carries the same number as its release (build-N) and different builds can't
      # be confused with each other.
      run: |
        Rename-Item dist/ClariStretch.exe "ClariStretch-build-${{ github.run_number }}.exe"

    - name: Compute SHA-256 checksum
      # Published in the release notes so anyone can confirm the file they downloaded
      # is exactly what this workflow built. Also handy for Microsoft false-positive
      # submissions, which ask for the file hash.
      id: hash
      run: |
        $hash = (Get-FileHash "dist/ClariStretch-build-${{ github.run_number }}.exe" -Algorithm SHA256).Hash
        "sha256=$hash" >> $env:GITHUB_OUTPUT

    # This step triggers on every push, creating a unique release version
    - name: Create GitHub Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: Build Version ${{ github.run_number }}
        body: |
          Automated compilation from latest push.
          Commit: ${{ github.sha }}
          SHA-256: `${{ steps.hash.outputs.sha256 }}`

          Built on GitHub's own servers from the source in this repo. The exe is
          unsigned, so Windows SmartScreen or Defender may warn about it; see the
          README section on code signing and SmartScreen.
        draft: false
        prerelease: false
        files: dist/ClariStretch-build-${{ github.run_number }}.exe
