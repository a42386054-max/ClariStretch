name: Auto Compile Claristretch to EXE

on:
  push:
    branches:
      - main  # Change to 'master' if your default branch uses that name

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # Installs PyInstaller and all required libraries
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt

    # Compiles code, hides console, bundles assets folder, and attaches icon.ico
    - name: Compile Script to EXE
      run: |
        pyinstaller --onefile --noconsole --add-data "assets;assets" --icon="assets/icon.ico" claristretch.py

    # Uploads the finished 'claristretch.exe' file to your GitHub dashboard
    - name: Upload Compiled EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: claristretch-windows-executable
        path: dist/claristretch.exe
        retention-days: 30
        # 2. ADD THE RELEASE STEP AT THE VERY END
    # Fix for 403 "Resource not accessible by integration":
# the default GITHUB_TOKEN is read-only, so it needs write access to create releases.
permissions:
  contents: write
  
        name: Release v1.0.${{ github.run_number }}
        files: claristretch-windows-executable.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
